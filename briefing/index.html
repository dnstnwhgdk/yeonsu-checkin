<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>고교학점제 설명회 신청</title>
<style>
  :root {
    --paper: #F6F4EF;
    --ink: #22283A;
    --ink-soft: #5A6072;
    --line: #D9D5C9;
    --accent: #2F6F62;
    --accent-soft: #E4EFE8;
    --danger: #B3452F;
  }
  * { box-sizing: border-box; }
  html { height: 100%; overscroll-behavior-y: none; }
  body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--paper); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  .wrap {
    max-width: 440px; margin: 0 auto;
    padding: 36px 20px calc(60px + env(safe-area-inset-bottom));
    padding-left: max(20px, env(safe-area-inset-left));
    padding-right: max(20px, env(safe-area-inset-right));
    -webkit-user-select: none; user-select: none;
  }
  input, select { -webkit-user-select: text; user-select: text; }

  .masthead { border-bottom: 2px solid var(--ink); padding-bottom: 14px; margin-bottom: 28px; }
  .masthead .kicker { font-size: 13px; color: var(--ink-soft); margin-bottom: 4px; }
  .masthead h1 { font-size: 21px; line-height: 1.4; margin: 0; font-weight: 700; }
  .meta-row { font-size: 13px; color: var(--ink-soft); margin-top: 8px; }

  section { margin-bottom: 20px; }
  .field-label { font-size: 14px; font-weight: 700; margin-bottom: 8px; color: var(--ink); }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  input[type="text"], select {
    width: 100%; padding: 16px 14px; font-size: 16px;
    border: 1px solid var(--line); border-radius: 4px;
    background: #fff; color: var(--ink);
    -webkit-appearance: none; appearance: none;
  }
  select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%235A6072' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat; background-position: right 14px center; padding-right: 34px;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .submit-btn {
    width: 100%; padding: 17px; font-size: 16px; font-weight: 700; color: #fff;
    background: var(--ink); border: none; border-radius: 4px; cursor: pointer;
    margin-top: 8px;
    transition: background 0.15s ease, opacity 0.15s ease;
  }
  .submit-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .submit-btn:not(:disabled):active { background: var(--accent); }

  .error-msg { font-size: 13px; color: var(--danger); margin-top: 10px; display: none; }
  .status-msg { font-size: 13px; color: var(--ink-soft); margin-top: 12px; text-align: center; min-height: 18px; }

  .done-screen { display: none; text-align: center; padding: 70px 20px; }
  .done-mark {
    width: 56px; height: 56px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 28px;
  }
  .done-screen h2 { font-size: 19px; margin: 0 0 8px; }
  .done-screen p { font-size: 14px; color: var(--ink-soft); line-height: 1.6; margin: 0; }
  .done-detail { margin-top: 24px; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 16px 18px; font-size: 14px; }
  .done-detail div { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .done-detail div:last-child { border-bottom: none; }
  .done-detail span:first-child { color: var(--ink-soft); }
</style>
</head>
<body>

<div class="wrap" id="formScreen">
  <div class="masthead">
    <div class="kicker">신청서</div>
    <h1>2026학년도 학부모 대상<br>고교학점제 설명회 신청</h1>
    <div class="meta-row" id="eventDate">2026-09-01</div>
  </div>

  <section>
    <div class="field-label">학생 이름</div>
    <input type="text" id="studentInput" placeholder="학생 이름을 입력하세요">
  </section>

  <section>
    <div class="field-label">학년반</div>
    <div class="row-2">
      <select id="gradeInput">
        <option value="">학년</option>
        <option value="1학년">1학년</option>
        <option value="2학년">2학년</option>
        <option value="3학년">3학년</option>
      </select>
      <select id="classInput">
        <option value="">반</option>
        <option value="1반">1반</option><option value="2반">2반</option>
        <option value="3반">3반</option><option value="4반">4반</option>
        <option value="5반">5반</option><option value="6반">6반</option>
        <option value="7반">7반</option><option value="8반">8반</option>
        <option value="9반">9반</option><option value="10반">10반</option>
      </select>
    </div>
  </section>

  <section>
    <div class="field-label">학부모 이름</div>
    <input type="text" id="parentInput" placeholder="학부모 이름을 입력하세요" autocomplete="name">
  </section>

  <section>
    <button class="submit-btn" id="submitBtn" disabled>신청하기</button>
    <div class="error-msg" id="errorMsg"></div>
    <div class="status-msg" id="statusMsg"></div>
  </section>
</div>

<div class="wrap done-screen" id="doneScreen">
  <div class="done-mark">✓</div>
  <h2>신청이 접수되었습니다</h2>
  <p>고교학점제 설명회 신청이 정상적으로 접수되었습니다.</p>
  <div class="done-detail">
    <div><span>학생</span><span id="doneStudent"></span></div>
    <div><span>학부모</span><span id="doneParent"></span></div>
    <div><span>신청시각</span><span id="doneTime"></span></div>
  </div>
</div>

<script>
  // ====== 담당자 설정 영역 ======
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxuKnMjBNI6iBJJaeP_msGrtnhfyxqV40VFgx7Yvn2pBAAOv0uK2aaXF6xK-Szn4VQx/exec";
  const SHEET_NAME = "고교학점제설명회신청"; // 이 이름으로 시트 탭이 자동 생성/구분됨
  // ================================

  document.getElementById('eventDate').textContent =
    new Intl.DateTimeFormat('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' }).format(new Date());

  const studentInput = document.getElementById('studentInput');
  const gradeInput = document.getElementById('gradeInput');
  const classInput = document.getElementById('classInput');
  const parentInput = document.getElementById('parentInput');
  const submitBtn = document.getElementById('submitBtn');

  function validateForm() {
    const ok =
      studentInput.value.trim().length > 0 &&
      gradeInput.value !== '' && classInput.value !== '' &&
      parentInput.value.trim().length > 0;
    submitBtn.disabled = !ok;
    return ok;
  }
  [studentInput, gradeInput, classInput, parentInput].forEach(el => {
    el.addEventListener('input', validateForm);
    el.addEventListener('change', validateForm);
  });

  submitBtn.addEventListener('click', async () => {
    const errorEl = document.getElementById('errorMsg');
    const statusEl = document.getElementById('statusMsg');
    errorEl.style.display = 'none';

    if (!validateForm()) return;

    submitBtn.disabled = true;
    statusEl.textContent = '제출 중입니다...';

    const payload = {
      formType: 'briefing_apply',
      department: SHEET_NAME,
      studentName: studentInput.value.trim(),
      grade: gradeInput.value,
      classNum: classInput.value,
      parentName: parentInput.value.trim(),
      submittedAt: new Date().toISOString()
    };

    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });

      document.getElementById('doneStudent').textContent = `${payload.grade} ${payload.classNum} ${payload.studentName}`;
      document.getElementById('doneParent').textContent = payload.parentName;
      document.getElementById('doneTime').textContent =
        new Intl.DateTimeFormat('ko-KR', { hour: '2-digit', minute: '2-digit' }).format(new Date());

      document.getElementById('formScreen').style.display = 'none';
      document.getElementById('doneScreen').style.display = 'block';
    } catch (err) {
      statusEl.textContent = '';
      errorEl.textContent = '제출에 실패했습니다. 네트워크 상태를 확인하고 다시 시도해 주세요.';
      errorEl.style.display = 'block';
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
